name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build can complete without live
          # credentials — no page in this app does data fetching at build
          # time that would require them to actually resolve.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          NEXT_PUBLIC_SITE_URL: https://cipresa.com
